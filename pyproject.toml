[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcq"
version = "0.1.0"
description = "INT8 post-training quantization of PatchCore (anomalib) with an MVTec AD benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anomalib>=2.0", "torch>=2.1", "torchvision", "timm", "numpy", "pillow", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
